{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - CareerFlow</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Register</h1>
            <p>Create your account</p>

            <form method="POST" action="{% url 'register' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username (Unique ID)" required>
                <input type="email" name="email" placeholder="Enter Email" required>
                <input type="text" name="phone" placeholder="Phone Number" required>
                
                <select name="user_type" id="user_type" onchange="toggleFields()" required>
                    <option value="" disabled selected>Select User Type</option>
                    <option value="student">Student</option>
                    <option value="company">Company</option>
                </select>

                <div id="student-fields">
                    <input type="text" name="course" placeholder="Course (e.g. B.Com)">
                    <input type="number" step="0.01" name="percentage" placeholder="Aggregate Percentage">
                    <textarea name="skills" placeholder="Skills (Java, Excel, etc.)"></textarea>
                    <label style="color: #64748b; font-size: 0.8rem; display: block; margin-top: 10px;">Upload Resume (PDF only):</label>
                    <input type="file" name="resume" accept=".pdf">
                </div>

                <input type="password" name="password" placeholder="Create Password" required>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>

                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <script>
    function toggleFields() {
        var userType = document.getElementById("user_type").value;
        var studentSection = document.getElementById("student-fields");
        studentSection.style.display = (userType === "student") ? "block" : "none";
    }
    </script>
</body>
</html>
