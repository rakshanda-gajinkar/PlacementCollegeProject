{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Placement Cell</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <h1>Login</h1>
        <p>Access your dashboard</p>

        <form method="POST" {%csrf_token %} onsubmit="submitForm(event, 'Login successful!')">
            <select required>
                <option value=""disbled selected>Select User Type</option>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
                <option value="company">Company</option>
            </select>

            <input type="email" name="email" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="auth-link">
            <p>Don't have an account? <a href="register.html">Register</a></p>
            <p style="margin-top: 10px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>
</div>

<script src="{% static 'JS/script.js' %}"></script>
</body>
</html>
