{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CareerFlow | Home</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'index' %}" class="logo">CareerFlow</a>
        <ul class="nav-links">
            <li><a href="{% url 'index' %}">Home</a></li>
            <li><a href="{% url 'register' %}">Register</a></li>
            <li><a href="{% url 'login' %}" style="background: var(--primary); color: white; padding: 10px 25px; border-radius: 5px;">Log In</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Find Your Dream Job Today</h1>
        <p>Browse through thousands of placement opportunities from top MNCs</p>
    </header>

    <div class="job-container">
        <h2 style="margin-bottom: 30px; text-align: center;">Recent Job Openings</h2>
        <div class="job-grid">
            <div class="job-card">
                <img src="https://via.placeholder.com/60" alt="Company" style="border-radius: 8px; margin-bottom: 15px;">
                <h3>Full Stack Developer</h3>
                <p style="color: #64748b; margin: 5px 0;">Google India</p>
                <p>Eligibility: 70% in B.Com/BCA</p>
                <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 700; color: var(--success);">₹12.5 LPA</span>
                    <a href="{% url 'login' %}" style="color: var(--primary); text-decoration: none; font-weight: 600;">View Details</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
